<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Fulcrum Advisory</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      text-align: center;
      padding: var(--space-5);
    }
    .error-inner {
      max-width: 480px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: var(--space-3);
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      color: var(--white);
      margin-bottom: var(--space-2);
    }
    .error-sub {
      color: rgba(255,255,255,0.55);
      margin-bottom: var(--space-4);
      font-size: 1rem;
      line-height: 1.65;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-logo {
      margin-bottom: var(--space-4);
    }
    .error-logo .logo-name {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--white);
    }
    .error-logo .logo-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      display: block;
      margin-top: 2px;
    }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-inner">
    <div class="error-logo">
      <div class="logo-name">Fulcrum Advisory</div>
      <span class="logo-tag">Defense · Cybersecurity · AI</span>
    </div>
    <div class="error-code">404 — Page Not Found</div>
    <h1 class="error-title">This Page Doesn't Exist</h1>
    <p class="error-sub">The page you're looking for doesn't exist or may have moved.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn--gold">Back to Home</a>
      <a href="contact.html" class="btn btn--outline-white">Contact Us</a>
    </div>
  </div>
</div>
</body>
</html>
